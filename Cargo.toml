[workspace]
members = [
    "crates/spawnr",
    "crates/spawnr-agent",
    "crates/spawnr-protocol",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/spawnr-dev/spawnr"

[workspace.dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive", "env"] }
libc = "0.2.172"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
semver = { version = "1.0.26", features = ["serde"] }
sha2 = "0.10.9"
thiserror = "2.0.12"
time = { version = "0.3.41", features = ["formatting", "parsing", "serde", "serde-well-known"] }
uuid = { version = "1.16.0", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
