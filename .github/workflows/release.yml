name: Release

on:
  push:
    tags:
      - "v*"
      - "runtime-v*"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Public release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require the configured public repository
        run: scripts/release-preflight.py repository "$GITHUB_REPOSITORY"

  build:
    name: Independent build ${{ matrix.builder }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        builder:
          - first
          - second
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Build candidate artifacts
        run: |
          nix build .#release-artifacts --out-link result --print-build-logs
          mkdir candidate
          cp --archive --dereference result/. candidate/

      - name: Verify candidate checksums
        working-directory: candidate
        run: sha256sum --check SHA256SUMS

      - name: Upload independent candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-candidate-${{ matrix.builder }}
          path: candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  reproduce:
    name: Reproduce and bind tag
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download first candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-candidate-first
          path: candidates/first

      - name: Download second candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-candidate-second
          path: candidates/second

      - name: Require byte-identical independent outputs
        run: |
          (cd candidates/first && sha256sum --check SHA256SUMS)
          (cd candidates/second && sha256sum --check SHA256SUMS)
          diff --recursive --no-dereference candidates/first candidates/second

      - name: Bind candidate to the pushed tag
        if: github.ref_type == 'tag'
        run: |
          scripts/release-preflight.py candidate \
            "${GITHUB_REF_NAME}" \
            candidates/first \
            --repository "$GITHUB_REPOSITORY"

      - name: Upload verified candidate
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: verified-release
          path: candidates/first/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  kvm:
    name: Exact-artifact KVM gate
    needs: reproduce
    runs-on:
      - self-hosted
      - linux
      - x64
      - spawnr-kvm
    timeout-minutes: 60
    environment: kvm-release
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download verified candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: verified-release
          path: verified

      - name: Run setup, doctor, and the critical KVM scenario
        env:
          SPAWNR_E2E_ENVIRONMENT: docker.io/library/rust@sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0
        run: scripts/ci-kvm-release.sh verified

  publish:
    name: Attest and publish
    if: github.ref_type == 'tag'
    needs: kvm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download verified candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: verified-release
          path: verified

      - name: Reverify the publication set
        working-directory: verified
        run: sha256sum --check SHA256SUMS

      - name: Select assets for this release channel
        run: |
          mkdir publication
          case "$GITHUB_REF_NAME" in
            runtime-v*)
              cp verified/LICENSE publication/
              cp verified/THIRD-PARTY-LICENSES.txt publication/
              cp verified/THIRD-PARTY-NOTICES.md publication/
              cp verified/runtime-metadata.json publication/
              cp verified/runtime.lock.json publication/
              cp verified/runtime-sources.json publication/
              cp verified/spawnr-runtime-*.spdx.json publication/
              cp verified/spawnr-runtime-*.tar.zst publication/
              ;;
            v*)
              cp verified/LICENSE publication/
              cp verified/PKGBUILD publication/
              cp verified/install.sh publication/
              cp verified/runtime.lock.json publication/
              cp verified/spawnr-bin.SRCINFO publication/
              cp verified/spawnr-*.rpm publication/
              cp verified/spawnr-*-x86_64-linux publication/
              cp verified/spawnr_*.deb publication/
              ;;
            *) echo "unsupported release tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          (
            cd publication
            find . -maxdepth 1 -type f -printf '%P\0' \
              | sort --zero-terminated \
              | xargs --null sha256sum
          ) > publication-checksums
          mv publication-checksums publication/SHA256SUMS

      - name: Attest every release artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: publication/*

      - name: Publish immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            runtime-v*) title="Spawnr runtime ${GITHUB_REF_NAME#runtime-v}" ;;
            v*) title="Spawnr ${GITHUB_REF_NAME#v}" ;;
            *) echo "unsupported release tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" publication/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --draft \
            --title "$title"
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

  deploy-installer:
    name: Deploy spawnr-cli.dev
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download verified candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: verified-release
          path: verified

      - name: Prepare the static installer channel
        run: |
          (cd verified && sha256sum --check SHA256SUMS)
          mkdir pages
          cp --archive site/. pages/
          mkdir -p pages/schemas
          install -m0444 release/runtime-lock.schema.json pages/schemas/runtime-lock-v1.json
          install -m0444 release/runtime-manifest.schema.json pages/schemas/runtime-manifest-v1.json
          install -m0555 verified/install.sh pages/install.sh
          find pages -type d -exec chmod 0555 {} +
          find pages -type f -exec chmod 0444 {} +
          chmod 0555 pages/install.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  public-smoke:
    name: Verify the public curl installer
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: deploy-installer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the tagged release contract
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download the verified release installer
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: verified-release
          path: verified

      - name: Install from spawnr-cli.dev and fetch the managed runtime
        run: |
          scripts/smoke-public-install.sh \
            "${GITHUB_REF_NAME#v}" \
            verified/install.sh
