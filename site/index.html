      <h1>Spawnr</h1>
      <p>Install the portable Linux x86_64 CLI:</p>
      <pre><code>curl -fsSL https://spawnr.dev/install.sh | sh</code></pre>
      <p>Then install its pinned runtime and verify the host:</p>
      <pre><code>spawnr setup
spawnr doctor</code></pre>
